name: Matrix Build & Artifacts Demo

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Step with the required matrix identifier
      - name: Build for Node ${{ matrix.node-version }} (matrix-fe0f77a)
        run: |
          echo "Simulating build for Node.js version ${{ matrix.node-version }}"
          echo "Build output for Node.js ${{ matrix.node-version }}" > build_output.txt
          echo "Identifier: matrix-fe0f77a" >> build_output.txt

      # Upload artifact with the required prefix
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-fe0f77a-node-${{ matrix.node-version }}
          path: build_output.txt
          retention-days: 7
